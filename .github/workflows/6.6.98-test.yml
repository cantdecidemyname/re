name: Run 6.6.98 (auto + manual)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'build pipeline version (e.g. android15-6.6)'
        required: false
        default: 'android15-6.6'
        type: string
      android_version:
        description: 'android branch (e.g. android15)'
        required: false
        default: 'android15'
        type: string
      os_patch_level:
        description: 'OS patch level (e.g. 2026-08 or lts-XX)'
        required: false
        default: '2026-08'
        type: string
      feature_set:
        description: 'Feature set'
        required: true
        type: choice
        options:
          - All
          - SUSFS
          - NoMount
          - BBG
          - NET
          - DS
          - NTSync
          - Ptrace
          - Unicode
          - Perf
          - BPF
        default: All
      root_flavor:
        description: 'Root flavor (choose none to leave empty)'
        required: false
        type: choice
        options:
          - none
          - kernelsu
          - resukisu
          - next
        default: none
      ksu_branch:
        description: 'KSU branch (optional)'
        required: false
        type: string
        default: ''
      susfs_commit:
        description: 'Pinned SUSFS commit (optional)'
        required: false
        type: string
        default: ''
      root_commit:
        description: 'Pinned root implementation commit (optional)'
        required: false
        type: string
        default: ''
      nomount_commit:
        description: 'NoMount commit (optional)'
        required: false
        type: string
        default: ''
      kernel_patches_commit:
        description: 'Kernel patches commit (optional)'
        required: false
        type: string
        default: ''
      anykernel3_commit:
        description: 'AnyKernel3 commit (optional)'
        required: false
        type: string
        default: ''
      droidspaces_commit:
        description: 'DroidSpaces commit (optional)'
        required: false
        type: string
        default: ''
      brand_name:
        description: 'Brand name'
        required: false
        type: string
        default: 'Wild'
      variant:
        description: 'Variant'
        required: false
        type: string
        default: 'Normal'
      bypass:
        description: 'Apply bypass (boolean)'
        required: false
        type: boolean
        default: false

jobs:
  # Automatic run on push to main
  build-on-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/build.yml
    with:
      version: 'android15-6.6'
      android_version: 'android15'
      kernel_version: '6.6'
      sublevel: '98'
      os_patch_level: '2026-08'
      feature_set: 'All'
      variant: 'Normal'
      ksu_branch: ''
      susfs_commit: ''
      root_flavor: ''
      root_commit: ''
      nomount_commit: ''
      kernel_patches_commit: ''
      anykernel3_commit: ''
      droidspaces_commit: ''
      brand_name: 'Wild'
      bypass: false

  # Manual dispatch that exposes all build.yml inputs in the UI but forces 6.6.98
  build-manual:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.inputs.version }}
      android_version: ${{ github.event.inputs.android_version }}
      kernel_version: '6.6'
      sublevel: '98'
      os_patch_level: ${{ github.event.inputs.os_patch_level }}
      feature_set: ${{ github.event.inputs.feature_set }}
      variant: ${{ github.event.inputs.variant }}
      ksu_branch: ${{ github.event.inputs.ksu_branch }}
      susfs_commit: ${{ github.event.inputs.susfs_commit }}
      root_flavor: ${{ github.event.inputs.root_flavor == 'none' ? '' : github.event.inputs.root_flavor }}
      root_commit: ${{ github.event.inputs.root_commit }}
      nomount_commit: ${{ github.event.inputs.nomount_commit }}
      kernel_patches_commit: ${{ github.event.inputs.kernel_patches_commit }}
      anykernel3_commit: ${{ github.event.inputs.anykernel3_commit }}
      droidspaces_commit: ${{ github.event.inputs.droidspaces_commit }}
      brand_name: ${{ github.event.inputs.brand_name }}
      bypass: ${{ github.event.inputs.bypass }}
